# Shared Gradle settings for reproducible Android builds.
# AGP/D8 can exceed Gradle's 512 MiB default while dexing Compose dependencies.
org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=768m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.workers.max=4
android.useAndroidX=true
kotlin.code.style=official
